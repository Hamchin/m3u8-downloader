<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<title>m3u8 Downloader</title>
</head>
<body>
  <header>
    <h1>m3u8 Downloader</h1>
  </header>

  <!-- 一覧 -->
  <section id="view-list">
    <p id="list-empty" class="muted" hidden>このページではまだ m3u8 が検出されていません。動画を再生すると検出されます。</p>
    <ul id="list"></ul>
  </section>

  <!-- 詳細（画質選択・ファイル名） -->
  <section id="view-detail" hidden>
    <button id="btn-back" class="link">← 一覧に戻る</button>
    <p id="detail-url" class="url"></p>
    <p id="detail-info" class="muted"></p>
    <div id="variant-box" hidden>
      <label>画質</label>
      <div id="variants"></div>
    </div>
    <div>
      <label for="filename">ファイル名</label>
      <input id="filename" type="text" spellcheck="false">
    </div>
    <p id="detail-error" class="error" hidden></p>
    <button id="btn-start" class="primary">ダウンロード開始</button>
  </section>

  <!-- 進捗 -->
  <section id="view-progress" hidden>
    <p id="progress-file" class="url"></p>
    <progress id="progress-bar" max="100" value="0"></progress>
    <p id="progress-text" class="muted"></p>
    <button id="btn-cancel">キャンセル</button>
    <button id="btn-close" class="link" hidden>閉じる</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
